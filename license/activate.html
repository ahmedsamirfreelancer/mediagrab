<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self';">
<title>MediaGrab — تفعيل الترخيص</title>
<style>
  @font-face {
    font-family: 'Zain';
    font-style: normal;
    font-weight: 400;
    src: url('fonts/zain-arabic-400.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Zain';
    font-style: normal;
    font-weight: 700;
    src: url('fonts/zain-arabic-700.woff2') format('woff2');
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Zain', 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4c1d95 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #f3f4f6;
    padding: 24px;
  }
  .card {
    background: rgba(15, 23, 42, 0.85);
    border: 1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(12px);
    border-radius: 20px;
    padding: 40px;
    width: 100%;
    max-width: 480px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.4);
  }
  .logo {
    text-align: center;
    margin-bottom: 28px;
  }
  .logo-icon {
    width: 72px;
    height: 72px;
    margin: 0 auto 12px;
    background: linear-gradient(135deg, #8b5cf6, #6366f1);
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    box-shadow: 0 10px 30px rgba(99,102,241,0.4);
  }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
  .subtitle { color: #94a3b8; font-size: 13px; }
  .field { margin-bottom: 16px; }
  label {
    display: block;
    font-size: 13px;
    margin-bottom: 8px;
    color: #cbd5e1;
    font-weight: 600;
  }
  input[type="text"] {
    width: 100%;
    padding: 14px 16px;
    background: rgba(15,23,42,0.6);
    border: 2px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    color: #fff;
    font-size: 16px;
    font-family: 'Courier New', monospace;
    letter-spacing: 1px;
    text-align: center;
    direction: ltr;
    outline: none;
    transition: border-color 0.2s;
  }
  input[type="text"]:focus {
    border-color: #8b5cf6;
    background: rgba(15,23,42,0.9);
  }
  .btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .btn-primary {
    background: linear-gradient(135deg, #8b5cf6, #6366f1);
    color: #fff;
  }
  .btn-primary:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 10px 25px rgba(139,92,246,0.4);
  }
  .btn-primary:disabled {
    opacity: 0.6;
    cursor: wait;
  }
  .btn-secondary {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.2);
    color: #cbd5e1;
    margin-top: 10px;
  }
  .btn-secondary:hover { background: rgba(255,255,255,0.05); }
  .msg {
    margin-top: 14px;
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 13px;
    text-align: center;
    display: none;
  }
  .msg.success {
    display: block;
    background: rgba(34,197,94,0.15);
    border: 1px solid rgba(34,197,94,0.3);
    color: #86efac;
  }
  .msg.error {
    display: block;
    background: rgba(239,68,68,0.15);
    border: 1px solid rgba(239,68,68,0.3);
    color: #fca5a5;
  }
  .fingerprint {
    margin-top: 24px;
    padding-top: 18px;
    border-top: 1px solid rgba(255,255,255,0.08);
    font-size: 11px;
    color: #64748b;
    text-align: center;
    font-family: monospace;
    direction: ltr;
    word-break: break-all;
  }
  .help {
    margin-top: 12px;
    text-align: center;
    font-size: 12px;
    color: #94a3b8;
  }
  .help a { color: #a78bfa; text-decoration: none; cursor: pointer; }
  .help a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">🎬</div>
      <h1>MediaGrab</h1>
      <div class="subtitle">تفعيل التطبيق</div>
    </div>

    <div class="field">
      <label for="license-key">مفتاح الترخيص</label>
      <input type="text" id="license-key" placeholder="ARQ-XXXXX-XXXXX-XXXXX-XXXXX" autocomplete="off" spellcheck="false">
    </div>

    <button class="btn btn-primary" id="activate-btn">تفعيل</button>
    <button class="btn btn-secondary" id="quit-btn">إنهاء</button>

    <div class="msg" id="msg"></div>

    <div class="help">
      ليس لديك مفتاح؟ <a id="buy-link">شراء ترخيص</a>
    </div>

    <div class="fingerprint" id="fingerprint"></div>
  </div>

  <script src="activate.js"></script>
</body>
</html>
