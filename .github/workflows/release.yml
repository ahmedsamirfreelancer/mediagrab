name: Build & Release MediaGrab

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump (patch/minor/major) — leave empty to keep current'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Configure git for version bumps
        if: github.event_name == 'workflow_dispatch' && inputs.version_bump != ''
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"

      - name: Bump version (manual dispatch only)
        if: github.event_name == 'workflow_dispatch' && inputs.version_bump != ''
        run: npm version ${{ inputs.version_bump }} --no-git-tag-version

      - name: Cache downloaded binaries
        id: cache-binaries
        uses: actions/cache@v4
        with:
          path: |
            resources/yt-dlp.exe
            resources/ffmpeg.exe
            resources/ffprobe.exe
          # Bust cache monthly so yt-dlp stays current; ffmpeg version is fixed in the script.
          key: mediagrab-binaries-${{ runner.os }}-2026-05

      - name: Install dependencies
        run: npm ci

      - name: Download bundled binaries (if not cached)
        if: steps.cache-binaries.outputs.cache-hit != 'true'
        run: node scripts/download-binaries.js

      - name: Build installer (obfuscate + electron-builder + publish)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MEDIAGRAB_BUILD_SECRET: ${{ secrets.MEDIAGRAB_BUILD_SECRET }}
        run: npm run build -- --publish always

      - name: Commit version bump (manual dispatch only)
        if: github.event_name == 'workflow_dispatch' && inputs.version_bump != ''
        run: |
          git add package.json package-lock.json
          git commit -m "chore: release v$(node -p \"require('./package.json').version\")"
          git push
