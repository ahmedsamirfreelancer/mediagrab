name: Build & Release MediaGrab

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      # تعديل ورك فلو لوحده مايستاهلش إصدار — لو عايز تجرّبه استعمل workflow_dispatch
      - '.github/workflows/**'
      # أداة نسخة المشتري — مالهاش علاقة بالتطبيق نفسه
      - 'scripts/build-buyer-copy.js'
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump (patch/minor/major) — leave empty to keep current'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Configure git for version bumps
        if: github.event_name == 'workflow_dispatch' && inputs.version_bump != ''
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"

      - name: Bump version (manual dispatch only)
        if: github.event_name == 'workflow_dispatch' && inputs.version_bump != ''
        run: npm version ${{ inputs.version_bump }} --no-git-tag-version

      - name: Cache downloaded binaries
        id: cache-binaries
        uses: actions/cache@v4
        with:
          path: |
            resources/yt-dlp.exe
            resources/ffmpeg.exe
            resources/ffprobe.exe
          # Bump this to bust the cache. Bumped 2026-08: the old cache was the
          # only reason Windows builds still had ffmpeg — the pinned download URL
          # had 404'd and the script was swallowing the failure.
          key: mediagrab-binaries-${{ runner.os }}-2026-08b

      - name: Install dependencies
        # Using `npm install` (not `npm ci`) so the workflow regenerates the
        # lock file when we add deps without running install locally.
        run: npm install --no-audit --no-fund

      - name: Download bundled binaries (if not cached)
        if: steps.cache-binaries.outputs.cache-hit != 'true'
        run: node scripts/download-binaries.js

      - name: Obfuscate sources
        # Cosmetic only — MediaGrab is free, there is no key to inject.
        run: node scripts/obfuscate.js

      - name: Build + publish installer
        # Publishes to the separate PUBLIC mediagrab-releases repo so installed
        # clients (which can't read this private repo) can fetch updates.
        # RELEASES_TOKEN = a fine-grained PAT with Contents:write on that repo.
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        # `--publish always` creates the GitHub release if missing.
        # We invoke electron-builder directly so this flag actually reaches it
        # (passing through `npm run build -- ...` is finicky in cmd/PowerShell).
        run: npx electron-builder --win nsis --publish always

      - name: Restore original sources
        if: always()
        run: node scripts/restore.js

      - name: Commit version bump (manual dispatch only)
        if: github.event_name == 'workflow_dispatch' && inputs.version_bump != ''
        run: |
          git add package.json package-lock.json
          git commit -m "chore: release v$(node -p \"require('./package.json').version\")"
          git push

  build-mac:
    # Runs AFTER the Windows job (and one arch at a time) on purpose: all three
    # builds publish assets into the SAME GitHub release, and parallel uploads
    # race each other into "release already exists" / half-uploaded assets.
    needs: build-windows
    runs-on: macos-latest
    strategy:
      max-parallel: 1
      matrix:
        arch: [arm64, x64]
    env:
      # Tells scripts/download-binaries.js WHICH ffmpeg/ffprobe to fetch — the
      # runner is Apple Silicon, so without this the x64 build would ship arm
      # binaries that can't run on an Intel Mac.
      MEDIAGRAB_TARGET_PLATFORM: darwin
      MEDIAGRAB_TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache downloaded binaries
        id: cache-binaries
        uses: actions/cache@v4
        with:
          path: |
            resources/yt-dlp
            resources/ffmpeg
            resources/ffprobe
          # Per-arch key: the two archs need different ffmpeg builds.
          key: mediagrab-binaries-mac-${{ matrix.arch }}-2026-08

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Download bundled binaries (if not cached)
        if: steps.cache-binaries.outputs.cache-hit != 'true'
        run: node scripts/download-binaries.js

      - name: Obfuscate sources
        run: node scripts/obfuscate.js

      - name: Build + publish .dmg
        # UNSIGNED build (no Apple Developer ID on this account yet), hence
        # CSC_IDENTITY_AUTO_DISCOVERY=false — otherwise electron-builder hunts
        # for a keychain cert and fails the job. Consequences for the user:
        # Gatekeeper needs one right-click → Open (or the xattr command in the
        # README), and in-app auto-update is replaced by a "download the new
        # version" prompt (see setupMacUpdateCheck in main.js).
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac dmg --${{ matrix.arch }} --publish always

      - name: Restore original sources
        if: always()
        run: node scripts/restore.js

  build-android:
    # After build-windows because that job is what creates the GitHub release we
    # upload into. Runs in parallel with the mac matrix — `gh release upload`
    # adds one asset and doesn't fight electron-builder over the release itself.
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build www from the desktop UI
        # One source of truth for the interface: android-app/www is generated
        # from server/public, never hand-copied.
        working-directory: android-app
        run: node build-www.js

      - name: Capacitor sync
        working-directory: android-app
        run: |
          npm install --no-audit --no-fund
          npx cap sync android

      - name: Restore signing keystore
        # Android identifies an app by its signing key: ship two APKs signed
        # differently and users cannot update from one to the other. The key
        # lives only in these secrets and on Ahmed's machine.
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set — refusing to publish an unsigned APK"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mediagrab.jks"
          cat > android-app/android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/mediagrab.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=mediagrab
          keyPassword=$KEYSTORE_PASSWORD
          EOF

      - name: Build signed APK
        working-directory: android-app/android
        run: |
          VERSION=$(node -p "require('../../package.json').version")
          # 1.0.37 -> 1000037, so versionCode always increases with the version.
          CODE=$(node -p "'$VERSION'.split('.').map(Number).reduce((a,n)=>a*1000+n,0)")
          echo "Building MediaGrab $VERSION (versionCode $CODE)"
          chmod +x gradlew
          ./gradlew assembleRelease -PmgVersionName="$VERSION" -PmgVersionCode="$CODE" --console=plain

      - name: Publish APK to the release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          APK=android-app/android/app/build/outputs/apk/release/app-release.apk
          cp "$APK" "MediaGrab-$VERSION.apk"
          gh release upload "$VERSION" "MediaGrab-$VERSION.apk" \
            --repo ahmedsamirfreelancer/mediagrab-releases --clobber
