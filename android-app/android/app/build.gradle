apply plugin: 'com.android.application'

android {
    namespace "com.arqami.mediagrab"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.arqami.mediagrab"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Version comes from the desktop package.json so all four downloads on
        // the release page carry the same number. Gradle properties let CI pass
        // it in (-PmgVersionName=1.0.37); the literals are only a local fallback.
        versionCode project.hasProperty('mgVersionCode') ? mgVersionCode.toInteger() : 1037
        versionName project.hasProperty('mgVersionName') ? mgVersionName : "1.0.37"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            // youtubedl-android ships python + yt-dlp + ffmpeg per ABI, and each
            // one costs ~50MB in the APK. armeabi-v7a is included so 32-bit
            // phones still install; every device sold since ~2017 uses arm64.
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release signing. The keystore lives OUTSIDE the repo
    // (C:\Users\ahmed\mediagrab-android-keys) — Android ties app identity to the
    // signing key, so losing it means no user can ever install an update on top
    // of what they already have. Back it up.
    signingConfigs {
        release {
            def props = new Properties()
            def f = rootProject.file('keystore.properties')
            if (f.exists()) {
                f.withInputStream { props.load(it) }
                storeFile file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Falls back to an unsigned build if keystore.properties is absent,
            // so a fresh clone still compiles.
            if (rootProject.file('keystore.properties').exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    packagingOptions {
        // youtubedl-android executes python/ffmpeg from extracted native libs,
        // so they must be unpacked on install (extractNativeLibs / legacy packaging).
        jniLibs {
            useLegacyPackaging true
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // On-device download engine (yt-dlp + python) and ffmpeg, bundled.
    implementation "io.github.junkfood02.youtubedl-android:library:0.18.1"
    implementation "io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
